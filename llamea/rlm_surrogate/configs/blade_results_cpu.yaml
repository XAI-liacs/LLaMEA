# CPU-feasible configuration for a real run over BLADE-results (~6.8k train
# examples across BBOB + MA-BBOB). Not the paper's frozen-pretrained-encoder
# setup (google/t5gemma-s-s-prefixlm is gated and unreachable without HF auth
# in this environment -- see results/report.md "Model setup notes"); this
# uses regress-lm's from-scratch vanilla transformer (public T5 SentencePiece
# vocab) with reduced width/context/epochs so a full pass finishes in a
# reasonable time on CPU only, no GPU.
# NOTE: median tokenized input length in this dataset is ~3.2k SentencePiece
# tokens (code bodies are long); max_input_len=512 below means most examples
# are heavily truncated to keep a CPU-only training run tractable (~5
# min/epoch at these dims, benchmarked on this environment's 4-core CPU).
# This is a compute-budget compromise for this sandboxed session, not a
# pipeline limitation -- rerun with a larger max_input_len (and ideally a
# GPU + the frozen T5Gemma encoder) for a real evaluation.
encoder_type: vanilla
d_model: 128
num_decoder_layers: 2
max_input_len: 512
max_num_objs: 1

optimizer: adafactor
lr: 1.0e-3
weight_decay: 0.0
warmup_steps: 100
total_steps: null

max_epochs: 6
batch_size: 64
patience: 2
seed: 0

num_samples_point_pred: 32
pretrained_checkpoint: null
